name: Universal Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Branch (e.g., ares-r-oss or gold-s-oss)'
        required: true
        default: 'gold-s-oss'
      compiler_url:
        description: 'Compiler URL (Proton, ZyC, etc. via .git)'
        required: true
        default: 'https://github.com/kdrag0n/proton-clang.git'
      custom_defconfig:
        description: 'Defconfig name (gold_defconfig, ares_defconfig)'
        required: true
        default: 'gold_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential python3 git zip unzip curl wget libssl-dev flex bison libelf-dev lld llvm libssl-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download Compiler
        run: |
          git clone --depth=1 ${{ github.event.inputs.compiler_url }} $GITHUB_WORKSPACE/clang-bin

      - name: Checkout Fork Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_ref }}
          path: kernel-source

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-source || { echo "Kernel source directory not found!"; exit 1; }
          
          CLANG_DIR=$GITHUB_WORKSPACE/clang-bin/bin
          export PATH=$CLANG_DIR:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="Custom Clang (Fork Build)"
          
          MAKE_ARGS=(
              ARCH=arm64 \
              CC="clang" \
              LD="ld.lld" \
              AR="llvm-ar" \
              NM="llvm-nm" \
              OBJCOPY="llvm-objcopy" \
              OBJDUMP="llvm-objdump" \
              STRIP="llvm-strip" \
              OBJSIZE="llvm-size" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 \
              LLVM_IAS=1 \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              DTC_EXT=$(which dtc)
          )

          DEFCONFIG=${{ github.event.inputs.custom_defconfig }}
          if [ -f arch/arm64/configs/vendor/$DEFCONFIG ]; then
              CONF=vendor/$DEFCONFIG
          elif [ -f arch/arm64/configs/$DEFCONFIG ]; then
              CONF=$DEFCONFIG
          else
              echo "!!! Error: Config $DEFCONFIG not found!"
              echo "List of available configs:"
              find arch/arm64/configs/ -name "*defconfig"
              exit 1
          fi
          
          echo "Starting build process with config: $CONF"
          
          mkdir -p out
          make O=out "${MAKE_ARGS[@]}" $CONF

          make -j$(nproc --all) O=out "${MAKE_ARGS[@]}"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ github.event.inputs.kernel_ref }}
          path: |
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/dtbo.img
            
